<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12261e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>EvoGenesis — The Living Preserve</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1612;color:#f1eddf}*{box-sizing:border-box}body{margin:0}header{padding:18px 18px 12px;background:#14281e;border-bottom:1px solid #38523b}h1{margin:0;font-size:24px;letter-spacing:2px;color:#dfc98b}h2{margin:8px 0 14px;font-size:20px}h3{margin:8px 0}p{line-height:1.45;color:#c9d4c6}.sub{font-size:12px;color:#b6c7b5}main{max-width:900px;margin:auto;padding:15px 14px 110px}.stats,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#182b22;border:1px solid #39513d;border-radius:14px;padding:14px;margin-bottom:12px}.stat{background:#233b2c;border-radius:10px;padding:11px;text-align:center;font-size:13px}.stat strong{display:block;font-size:21px;color:#f1d795}button,select,input{font:inherit}button{background:#d9be79;color:#17271b;border:0;border-radius:10px;padding:11px 13px;font-weight:700;cursor:pointer;min-height:42px}button:disabled{opacity:.4;cursor:not-allowed}button.alt{background:#36533d;color:#f2f0e6}button.danger{background:#793f3c;color:white}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{flex:1 1 110px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#102018;border-top:1px solid #456048;padding:8px 6px max(10px,env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;background:none;color:#c1cdbd;padding:8px 1px;font-size:11px}.tabs button.active{background:#37543e;color:#ffe0a0}.pill{display:inline-block;border:1px solid #68846b;border-radius:20px;padding:4px 8px;font-size:12px;margin:3px 4px 3px 0}.bar{height:9px;background:#354a3c;border-radius:10px;overflow:hidden;margin:4px 0 10px}.bar span{display:block;height:100%;background:#d6bb77}.muted{color:#aebdad;font-size:13px}.log{border-bottom:1px solid #3a5040;padding:9px 0;font-size:13px}input,select{width:100%;padding:11px;background:#263c2d;color:white;border:1px solid #668068;border-radius:9px;margin:6px 0 10px}.portrait{font-size:48px;text-align:center;padding:12px;background:linear-gradient(135deg,#334c35,#17271e);border-radius:12px}.notice{border-left:3px solid #d9be79;padding:9px;background:#263a2c;margin:12px 0}.tiny{font-size:11px}.hidden{display:none}

/* EvoGenesis v0.2 illustrated hybrid theme */
:root{background:#0c1712;color:#f4ebd2}body{background:radial-gradient(circle at 50% 0,#233d2a,#0a1511 65%);min-height:100vh}header{background:linear-gradient(135deg,#0e251b,#24442e);border-bottom:2px solid #94794c;box-shadow:0 6px 20px #0006}header h1{font-family:Georgia,serif;font-size:clamp(25px,7vw,38px);text-shadow:0 2px 5px #000}h2,h3{font-family:Georgia,serif;color:#efd8a3}h2{font-size:25px}main{max-width:940px}.card{background:linear-gradient(155deg,#23392b,#14261d);border:1px solid #77663f;box-shadow:0 8px 24px #0003;border-radius:17px}.stat{background:linear-gradient(155deg,#35523a,#213b2b);border:1px solid #746d46}.stat strong{color:#ffe1a0}button{background:linear-gradient(#f1d99c,#c7a765);border:1px solid #f5dfab;box-shadow:0 2px 0 #806335}button.alt{background:linear-gradient(#496a4e,#2c4b36);border:1px solid #688468;box-shadow:none}.tabs{background:#101f17;border-top:2px solid #917a4a}.tabs button{box-shadow:none;border:0}.tabs button.active{background:#37533c}.portrait{padding:0;overflow:hidden;background:#14251b}.hero{position:relative;border-radius:18px;overflow:hidden;border:2px solid #a78b53;box-shadow:0 12px 28px #0008;margin-bottom:15px;min-height:245px;background:#172b20}.hero img{width:100%;height:clamp(245px,54vw,420px);object-fit:cover;display:block}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#08130deb,transparent 65%);pointer-events:none}.hero-caption{position:absolute;bottom:15px;left:17px;right:17px;z-index:1}.hero-caption h2{margin:0;font-size:27px;text-shadow:0 2px 6px #000}.hero-caption p{margin:3px 0;color:#e4e8d8}.map-pins{position:absolute;inset:0;z-index:2;pointer-events:none}.map-pin{pointer-events:auto;position:absolute;padding:6px 9px;min-height:32px;font-size:11px;color:#f9e7b7;background:#13291ddf;border:1px solid #d2b77b;border-radius:15px;box-shadow:0 3px 10px #0009}.pin-lodge{top:23%;left:15%}.pin-habitat{top:66%;left:48%}.pin-supply{top:76%;left:8%}.feature{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:14px;align-items:center}.feature img{width:100%;aspect-ratio:4/5;object-fit:cover;border:2px solid #a48b59;border-radius:12px}.feature h3{font-size:22px;margin:2px 0}.creature-portrait{height:260px;width:100%;object-fit:contain;background:radial-gradient(circle,#56694a,#12251b);border-radius:12px}.creature-portrait.dire{filter:contrast(1.16) saturate(.8) hue-rotate(180deg);background:radial-gradient(circle,#526c8a,#111b2c)}.mini-badge{display:inline-block;padding:4px 9px;background:#394b34;border:1px solid #89764e;border-radius:20px;font-size:12px}.ornament{border-bottom:1px solid #8a7549;padding-bottom:8px;margin-bottom:12px}.research-art{height:82px;background:linear-gradient(90deg,#152b21c9,#1c3328aa),url('assets/valley.webp') center/cover;border-radius:10px;display:flex;align-items:center;padding:12px;font-size:30px}.lineage-row{display:flex;align-items:center;gap:10px}.lineage-row img{width:50px;height:50px;object-fit:cover;border-radius:9px;border:1px solid #aa955e}.progress-note{font-size:12px;color:#e0d3b0}.game-tip{font-size:13px;background:#293e2d;border-left:3px solid #d7b877;padding:10px;border-radius:6px;margin-top:10px}button:focus-visible{outline:3px solid #fff1b8;outline-offset:3px}@media(min-width:650px){.layout-two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.layout-two>.card{align-self:start}}
</style></head><body><header><div class="sub">HIDDEN PRESERVE · RESEARCH & CONSERVATION</div><h1>EVOGENESIS</h1><div class="sub">Every Legend Has an Origin. · v0.2</div></header><main id="app"></main><nav class="tabs" id="tabs"></nav>
<script>
"use strict";
const KEY="evogenesis-v01-save", tabs=["Preserve","Creatures","Research","Lineages","Journal"];
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let page="Preserve", selected=1, state;
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function wolf(id,name,sex,gen,parents=[],genes=null){
 return {id,name,sex,gen,parents,age:sex==="F"||sex==="M"?12:0,form:"Grey Wolf",health:90,welfare:85,trust:40,energy:85,experience:0,level:1,observations:0,training:0,habitat:"Forest",genes:genes||{cold:rand(25,45),power:rand(25,45),instinct:rand(25,45)},traits:[],resonance:0};
}
function fresh(){return {version:1,day:1,ap:4,food:40,supplies:18,knowledge:0,seq:3,creatures:[wolf(1,"Ash","M",1),wolf(2,"Fern","F",1)],research:{behavior:0,cold:0,heritage:0},completed:[],journal:[{day:1,text:"The First Preserve opens. Ash and Fern arrive at the forest enclosure."}],births:0};}
function valid(s){return s&&s.version===1&&Number.isInteger(s.day)&&s.day>0&&Array.isArray(s.creatures)&&s.creatures.length<=250&&Array.isArray(s.journal)&&s.research&&typeof s.food==="number"&&typeof s.supplies==="number"&&typeof s.ap==="number"&&Number.isInteger(s.seq)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert("Save failed. Export a backup from the Preserve tab.");}}
try{let x=JSON.parse(localStorage.getItem(KEY));state=valid(x)?x:fresh()}catch(e){state=fresh()}
function note(t){state.journal.unshift({day:state.day,text:t});state.journal=state.journal.slice(0,250)}
function finish(msg){save();render();if(msg)toast(msg)}
function toast(msg){let n=document.getElementById("notice");if(n){n.textContent=msg;n.classList.remove("hidden");setTimeout(()=>{if(n)n.classList.add("hidden")},3200)}}
function chosen(){return state.creatures.find(c=>c.id===selected)||state.creatures[0]}
function bar(n){return `<div class="bar"><span style="width:${clamp(n)}%"></span></div>`}
function stats(){return `<div class="stats"><div class="stat">Day<strong>${state.day}</strong></div><div class="stat">Food<strong>${state.food}</strong></div><div class="stat">Supplies<strong>${state.supplies}</strong></div><div class="stat">Actions<strong>${state.ap}/4</strong></div><div class="stat">Research<strong>${state.knowledge}</strong></div><div class="stat">Residents<strong>${state.creatures.length}</strong></div></div>`}
function preserve(){return `<h2>The First Preserve</h2>${stats()}<div class="card"><h3>🌲 Temperate Forest</h3><p>A secluded woodland enclosure concealed by the Veil. Your first task is to care for its inhabitants and investigate their hidden potential.</p><div class="notice hidden" id="notice"></div><div class="actions"><button onclick="nextDay()">Advance Day →</button><button class="alt" onclick="forage()">Gather Supplies (1 action)</button></div></div><div class="card"><h3>Research milestones</h3>${Object.entries(PROJECTS).map(([k,p])=>`<div class="log">${state.completed.includes(k)?"✅":"🔬"} ${p.name}: ${Math.min(state.research[k],p.goal)}/${p.goal}</div>`).join("")}</div><div class="card"><h3>Save & Backup</h3><p class="muted">Game saves automatically on this device. Export backups before clearing browser data or switching phones.</p><div class="actions"><button class="alt" onclick="backup()">Export Save</button><button class="alt" onclick="document.getElementById('restore').click()">Import Save</button><button class="danger" onclick="resetGame()">New Game</button></div><input id="restore" class="hidden" type="file" accept=".json,application/json" onchange="restore(event)"></div>`}
function creatures(){let c=chosen();return `<h2>Creature Sanctuary</h2><label class="muted">Select resident</label><select onchange="selected=Number(this.value);render()">${state.creatures.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)} · G${x.gen} · ${x.sex}</option>`).join("")}</select><div class="card"><div class="portrait">${c.form==="Dire Wolf"?"🐺✨":"🐺"}</div><h3>${esc(c.name)} <span class="pill">${c.form}</span></h3><p class="muted">ID ${c.id} · Generation ${c.gen} · ${c.sex==="M"?"Male":"Female"} · Age ${c.age} days · Level ${c.level} · ${esc(c.habitat)}</p>${[["Health",c.health],["Welfare",c.welfare],["Trust",c.trust],["Energy",c.energy]].map(([a,b])=>`<div class="tiny">${a}: ${b}</div>${bar(b)}`).join("")}<p class="muted">Genes: Cold ${c.genes.cold} · Power ${c.genes.power} · Instinct ${c.genes.instinct} · Resonance ${c.resonance}</p><p class="muted">Observations ${c.observations} · Training ${c.training} · Experience ${c.experience}</p><div class="actions"><button onclick="care('feed')">Feed · 2 food</button><button onclick="care('observe')">Observe · 1 supply</button><button onclick="care('train')">Train</button><button onclick="care('enrich')">Enrich</button><button onclick="care('rest')">Rest</button><button class="alt" onclick="care('cold')">Cold Study · 2 supplies</button></div><p class="tiny">Each care action costs 1 daily action. Cold Study requires the Cold Adaptation research project.</p><div class="actions"><button class="alt" onclick="transform()">Investigate Transformation</button></div></div>`}
const PROJECTS={behavior:{name:"Behavioral Observation",goal:6},cold:{name:"Cold Adaptation",goal:8},heritage:{name:"Hereditary Traits",goal:6}};
function research(){return `<h2>Research Institute</h2><p>Observations and controlled studies reveal how creatures develop. Research progress is shared across the preserve.</p>${Object.entries(PROJECTS).map(([k,p])=>`<div class="card"><h3>${p.name}</h3><p class="muted">${k==="behavior"?"Observe residents to understand temperament and build trust.":k==="cold"?"Study inherited cold tolerance and controlled environmental exposure.":"Record offspring and compare their inherited characteristics."}</p>${bar(state.research[k]/p.goal*100)}<p>${state.research[k]}/${p.goal} ${state.completed.includes(k)?"· COMPLETE":""}</p><div class="actions"><button ${state.completed.includes(k)?"disabled":""} onclick="study('${k}')">Research · 2 supplies + 1 action</button></div></div>`).join("")}<div class="card"><h3>Research Findings</h3>${state.completed.length?state.completed.map(k=>`<span class="pill">✓ ${PROJECTS[k].name}</span>`).join(""):"<p>No projects completed yet.</p>"}</div>`}
function lineages(){let adults=state.creatures.filter(c=>c.age>=10&&c.health>=55&&c.welfare>=55);return `<h2>Lineage Development</h2><div class="card"><h3>Breeding Program</h3><p>Pair unrelated healthy adult wolves. Offspring inherit a blend of parental traits with small genetic variation. Both parents must be well cared for.</p><label>Male parent</label><select id="father">${adults.filter(c=>c.sex==="M").map(c=>`<option value="${c.id}">${esc(c.name)} (G${c.gen})</option>`).join("")}</select><label>Female parent</label><select id="mother">${adults.filter(c=>c.sex==="F").map(c=>`<option value="${c.id}">${esc(c.name)} (G${c.gen})</option>`).join("")}</select><label>Offspring name</label><input id="babyname" maxlength="24" placeholder="Name your pup"><div class="actions"><button onclick="breed()">Breed · 3 actions + 6 food</button></div><p class="tiny">Requires completed Hereditary Traits research, 2 healthy unrelated adults, and no more than 20 residents in v0.1.</p></div><div class="card"><h3>Recorded Lineages</h3>${state.creatures.map(c=>`<div class="log"><b>${esc(c.name)}</b> · G${c.gen} · ${c.form} · ${c.age} days<br><span class="muted">Parents: ${c.parents.length?c.parents.map(id=>esc(state.creatures.find(p=>p.id===id)?.name||"Unknown")).join(" + "):"Founding animal"} · Cold ${c.genes.cold} / Power ${c.genes.power}</span></div>`).join("")}</div>`}
function journal(){return `<h2>Field Journal</h2><div class="card"><p class="muted">A permanent record of your preserve's research and discoveries.</p>${state.journal.map(j=>`<div class="log"><b>Day ${j.day}</b> · ${esc(j.text)}</div>`).join("")}</div>`}
function render(){document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="${page===t?"active":""}" onclick="page='${t}';render()">${({Preserve:"🏡",Creatures:"🐾",Research:"🔬",Lineages:"🧬",Journal:"📖"})[t]}<br>${t}</button>`).join("");document.getElementById("app").innerHTML=({Preserve:preserve,Creatures:creatures,Research:research,Lineages:lineages,Journal:journal})[page]();}
function spend(ap=1,food=0,supplies=0){if(state.ap<ap){alert("Not enough actions. Advance to the next day.");return false}if(state.food<food||state.supplies<supplies){alert("Not enough resources. Gather supplies or advance the day.");return false}state.ap-=ap;state.food-=food;state.supplies-=supplies;return true}
function care(type){let c=chosen(),cost=type==="feed"?2:0,sup=type==="observe"?1:type==="cold"?2:0;if(type==="cold"&&!state.completed.includes("cold")){alert("Complete Cold Adaptation research first.");return}if(!spend(1,cost,sup))return;
if(type==="feed"){c.health=clamp(c.health+8);c.welfare=clamp(c.welfare+7);c.energy=clamp(c.energy+5)}
if(type==="observe"){c.observations++;c.trust=clamp(c.trust+4);state.research.behavior+=2;state.knowledge+=2}
if(type==="train"){if(c.energy<15){state.ap++;alert("Too tired to train.");return}c.training++;c.energy=clamp(c.energy-16);c.experience+=12;c.genes.power=clamp(c.genes.power+1,0,90);c.trust=clamp(c.trust+2);if(c.experience>=c.level*25){c.experience=0;c.level++}}
if(type==="enrich"){c.welfare=clamp(c.welfare+12);c.trust=clamp(c.trust+6);c.energy=clamp(c.energy-4)}
if(type==="rest"){c.energy=clamp(c.energy+25);c.health=clamp(c.health+4)}
if(type==="cold"){c.resonance=clamp(c.resonance+rand(8,13));c.energy=clamp(c.energy-10);c.welfare=clamp(c.welfare-2);state.research.cold++}
complete();finish(`${c.name}: ${type} complete.`)}
function study(k){if(state.completed.includes(k))return;if(!spend(1,0,2))return;state.research[k]+=2;state.knowledge+=3;complete();finish("Research progress recorded.")}
function complete(){for(let [k,p] of Object.entries(PROJECTS))if(state.research[k]>=p.goal&&!state.completed.includes(k)){state.completed.push(k);note(`Research breakthrough: ${p.name} completed.`)}}
function forage(){if(!spend())return;state.food+=rand(3,6);state.supplies+=rand(1,3);finish("Supplies gathered.")}
function related(a,b){return a.id===b.id||a.parents.includes(b.id)||b.parents.includes(a.id)||a.parents.some(x=>b.parents.includes(x))}
function breed(){let a=state.creatures.find(c=>c.id===Number(document.getElementById("father")?.value)),b=state.creatures.find(c=>c.id===Number(document.getElementById("mother")?.value));let name=document.getElementById("babyname").value.trim();if(!state.completed.includes("heritage"))return alert("Complete Hereditary Traits research first.");if(!a||!b||related(a,b))return alert("Choose two unrelated adult wolves.");if(state.creatures.length>=20)return alert("The forest enclosure is full (20 residents).");if(!name)return alert("Enter an offspring name.");if(!spend(3,6))return;let genes={};for(let k of ["cold","power","instinct"])genes[k]=clamp(Math.round((a.genes[k]+b.genes[k])/2)+rand(-7,7),5,95);let baby=wolf(state.seq++,name,Math.random()<.5?"M":"F",Math.max(a.gen,b.gen)+1,[a.id,b.id],genes);baby.age=0;baby.health=85;baby.welfare=85;baby.trust=20;baby.energy=75;state.creatures.push(baby);state.births++;state.research.heritage+=2;state.knowledge+=5;note(`${name} was born to ${a.name} and ${b.name}, Generation ${baby.gen}.`);complete();selected=baby.id;page="Creatures";finish("A new generation begins!")}
function transform(){let c=chosen();if(c.form!=="Grey Wolf")return alert("This creature has already transformed.");let needed=[];if(!state.completed.includes("cold"))needed.push("complete Cold Adaptation research");if(c.age<10)needed.push("reach adulthood (10 days)");if(c.level<3)needed.push("reach level 3");if(c.genes.cold<35)needed.push("cold trait at least 35");if(c.resonance<40)needed.push("resonance at least 40");if(c.welfare<60)needed.push("welfare at least 60");if(needed.length)return alert("Transformation requirements:\n• "+needed.join("\n• "));if(!spend(2,0,3))return;c.form="Dire Wolf";c.health=clamp(c.health+15);c.genes.power=clamp(c.genes.power+8);note(`${c.name} transformed into a Dire Wolf through adaptive resonance!`);finish("Transformation discovered: Dire Wolf!")}
function nextDay(){state.day++;state.ap=4;state.food+=2;for(let c of state.creatures){c.age++;c.energy=clamp(c.energy+16);c.welfare=clamp(c.welfare-2);if(state.food>=1){state.food--;c.health=clamp(c.health+1)}else{c.health=clamp(c.health-6);c.welfare=clamp(c.welfare-6)}if(c.health<=0){c.health=1;c.welfare=0} }if(state.day%5===0){state.supplies+=3;note("Routine preserve delivery: 3 research supplies received.")}note(`Day ${state.day} begins. Residents cared for and supplies updated.`);finish("A new day begins.")}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`EvoGenesis-Day-${state.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function restore(ev){let f=ev.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!valid(data)||!data.creatures.every(c=>c&&c.genes&&typeof c.name==="string"&&Array.isArray(c.parents)))throw Error("Invalid save file");if(!confirm("Replace your current preserve with this backup?"))return;state=data;selected=state.creatures[0]?.id||1;save();render();alert("Save restored.")}catch(e){alert("Could not import this save: "+e.message)}}
function resetGame(){if(confirm("Start a new preserve? Export a backup first. This replaces your current save.")){state=fresh();selected=1;page="Preserve";finish("New preserve created.")}}

function preserve(){let c=chosen();return `<div class="hero"><img src="assets/preserve.webp" alt="Illustrated forest preserve with research lodge, wolf habitat, streams and paths"><div class="map-pins"><button class="map-pin pin-lodge" onclick="page='Research';render()">⌕ Research Lodge</button><button class="map-pin pin-habitat" onclick="page='Creatures';render()">🐾 Wolf Habitat</button><button class="map-pin pin-supply" onclick="forage()">✦ Gather</button></div><div class="hero-caption"><h2>The First Preserve</h2><p>Hidden beyond the Veil · Temperate Forest</p></div></div>${stats()}<div class="layout-two"><div><div class="card"><h3 class="ornament">✦ Preserve Operations</h3><p>Your secluded sanctuary is growing. Care for its residents, study inherited traits and uncover ancient forms.</p><div class="notice hidden" id="notice"></div><div class="actions"><button onclick="nextDay()">☀ Advance Day</button><button class="alt" onclick="forage()">Gather Supplies · 1 action</button></div></div><div class="card"><h3>✧ Research Milestones</h3>${Object.entries(PROJECTS).map(([k,p])=>`<div class="log">${state.completed.includes(k)?'✓':'◇'} ${p.name} <span class="muted">${Math.min(state.research[k],p.goal)}/${p.goal}</span>${bar(state.research[k]/p.goal*100)}</div>`).join('')}</div></div><div><div class="card"><h3>Featured Resident</h3><div class="feature"><img src="assets/wolf.webp" alt="Illustrated grey wolf in a forest"><div><h3>${esc(c.name)}</h3><span class="mini-badge">${esc(c.form)}</span><p class="muted">Generation ${c.gen} · Level ${c.level}</p><p class="progress-note">Welfare ${c.welfare}% · Trust ${c.trust}%</p><button class="alt" onclick="page='Creatures';render()">View Resident</button></div></div></div><div class="card"><h3>Recent Discoveries</h3>${state.journal.slice(0,3).map(j=>`<div class="log"><b>Day ${j.day}</b> · ${esc(j.text)}</div>`).join('')}</div></div></div><div class="card"><h3>Save & Backup</h3><p class="muted">Your existing v0.1 preserve is retained automatically on this website. Export a JSON backup before resetting or changing devices.</p><div class="actions"><button class="alt" onclick="backup()">Export Save</button><button class="alt" onclick="document.getElementById('restore').click()">Import Save</button><button class="danger" onclick="resetGame()">New Game</button></div><input id="restore" class="hidden" type="file" accept=".json,application/json" onchange="restore(event)"></div>`}
function creatures(){let c=chosen(),dire=c.form==='Dire Wolf';return `<h2>Creature Sanctuary</h2><label class="muted">Select resident</label><select onchange="selected=Number(this.value);render()">${state.creatures.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)} · G${x.gen} · ${x.sex}</option>`).join('')}</select><div class="card"><img class="creature-portrait ${dire?'dire':''}" src="assets/wolf.webp" alt="Illustrated ${dire?'Dire Wolf':'Grey Wolf'}"><h3>${esc(c.name)} <span class="pill">${esc(c.form)}</span></h3><p class="muted">ID ${c.id} · Generation ${c.gen} · ${c.sex==='M'?'Male':'Female'} · Age ${c.age} days · Level ${c.level} · ${esc(c.habitat)}</p>${[['Health',c.health],['Welfare',c.welfare],['Trust',c.trust],['Energy',c.energy]].map(([a,b])=>`<div class="tiny">${a}: ${b}</div>${bar(b)}`).join('')}<h3>Inherited Genetics</h3><p class="muted">Cold ${c.genes.cold} · Power ${c.genes.power} · Instinct ${c.genes.instinct}</p><p class="muted">Mythic Resonance ${c.resonance} · Observations ${c.observations} · Training ${c.training} · Experience ${c.experience}</p><h3>Daily Care</h3><div class="actions"><button onclick="care('feed')">Feed · 2 food</button><button onclick="care('observe')">Observe · 1 supply</button><button onclick="care('train')">Train</button><button onclick="care('enrich')">Enrich</button><button onclick="care('rest')">Rest</button><button class="alt" onclick="care('cold')">Cold Study · 2 supplies</button></div><p class="tiny">Each care action costs 1 daily action. Cold Study requires completed Cold Adaptation research.</p><h3>Adaptive Transformation</h3><div class="game-tip">Dire Wolf requirements: Cold Adaptation complete · Age 10+ · Level 3+ · Cold gene 35+ · Resonance 40+ · Welfare 60+. Transformation costs 2 actions and 3 supplies.</div><div class="actions"><button class="alt" onclick="transform()">✦ Investigate Transformation</button></div><div class="notice hidden" id="notice"></div></div>`}
function research(){return `<h2>Research Institute</h2><div class="hero" style="min-height:110px"><img src="assets/valley.webp" style="height:130px" alt="Painted mountain valley surrounding the hidden preserve"><div class="hero-caption"><h2>Field Studies</h2></div></div><p>Observe, experiment and document the origins of extraordinary life.</p>${Object.entries(PROJECTS).map(([k,p])=>`<div class="card"><div class="research-art">${k==='behavior'?'🐾':k==='cold'?'❄':'✧'}</div><h3>${p.name}</h3><p class="muted">${k==='behavior'?'Observe residents to understand temperament and build trust.':k==='cold'?'Study inherited cold tolerance and controlled environmental exposure.':'Record offspring and compare their inherited characteristics.'}</p>${bar(state.research[k]/p.goal*100)}<p>${state.research[k]}/${p.goal} ${state.completed.includes(k)?'· COMPLETE':''}</p><div class="actions"><button ${state.completed.includes(k)?'disabled':''} onclick="study('${k}')">Research · 2 supplies + 1 action</button></div></div>`).join('')}<div class="card"><h3>Research Findings</h3>${state.completed.length?state.completed.map(k=>`<span class="pill">✓ ${PROJECTS[k].name}</span>`).join(''):'<p>No projects completed yet.</p>'}<div class="notice hidden" id="notice"></div></div>`}
function lineages(){let adults=state.creatures.filter(c=>c.age>=10&&c.health>=55&&c.welfare>=55);return `<h2>Lineage Development</h2><div class="card"><h3>Breeding Program</h3><p>Pair unrelated healthy adult wolves. Offspring inherit a blend of parental traits with small genetic variation.</p><label>Male parent</label><select id="father">${adults.filter(c=>c.sex==='M').map(c=>`<option value="${c.id}">${esc(c.name)} (G${c.gen})</option>`).join('')}</select><label>Female parent</label><select id="mother">${adults.filter(c=>c.sex==='F').map(c=>`<option value="${c.id}">${esc(c.name)} (G${c.gen})</option>`).join('')}</select><label>Offspring name</label><input id="babyname" maxlength="24" placeholder="Name your pup"><div class="actions"><button onclick="breed()">Breed · 3 actions + 6 food</button></div><p class="tiny">Requires Hereditary Traits research, unrelated adults and available habitat space.</p><div class="notice hidden" id="notice"></div></div><div class="card"><h3>Recorded Lineages</h3>${state.creatures.map(c=>`<div class="log lineage-row"><img src="assets/wolf.webp" alt="Wolf portrait"><div><b>${esc(c.name)}</b> · G${c.gen} · ${esc(c.form)} · ${c.age} days<br><span class="muted">Parents: ${c.parents.length?c.parents.map(id=>esc(state.creatures.find(p=>p.id===id)?.name||'Unknown')).join(' + '):'Founding animal'} · Cold ${c.genes.cold} / Power ${c.genes.power}</span></div></div>`).join('')}</div>`}
function journal(){return `<h2>Field Journal</h2><div class="hero" style="min-height:110px"><img src="assets/valley.webp" style="height:130px" alt="Illustrated mountain wilderness"><div class="hero-caption"><h2>Records & Discoveries</h2></div></div><div class="card"><p class="muted">A permanent record of your preserve's research and discoveries.</p>${state.journal.map(j=>`<div class="log"><b>Day ${j.day}</b> · ${esc(j.text)}</div>`).join('')}</div>`}

render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script></body></html>
