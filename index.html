function tile(x,y,map=state.map){return(rawMaps[map][y]||'')[x]||'#'}function solid(x,y,map=state.map){return '#Ht~'.includes(tile(x,y,map))}function entityAt(x,y){return defs[state.map].entities.find(e=>e.x===x&&e.y===y)}function move(dir){if(host.innerHTML)return;state.face=dir;let dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0,nx=state.x+dx,ny=state.y+dy;if(entityAt(nx,ny)){interact(entityAt(nx,ny));return}if(solid(nx,ny)){notify('The way is blocked.');return}state.x=nx;state.y=ny;state.steps++;walkTick=8;const bottom=rawMaps[state.map].length-1;if(state.map==='town'&&ny===bottom){state.map='forest';state.x=11;state.y=1;notify('Entered Whisperwood Trail')}else if(state.map==='forest'&&ny===0){state.map='town';state.x=11;state.y=bottom-1;notify('Returned to Asterfall Village')}else if(state.map==='forest'&&ny===bottom){state.map='ruins';state.x=11;state.y=1;notify('Entered Sunken Ruins')}else if(state.map==='ruins'&&ny===0){state.map='forest';state.x=11;state.y=bottom-1;notify('Returned to Whisperwood Trail')}if(state.steps%6===0)save();updateHUD()}

function enemyTurn(){const a=state.party[0];if(a&&a.hp>0){const dmg=Math.max(1,battle.wild.attack-Math.floor(a.def/2)+Math.floor(Math.random()*4));a.hp=Math.max(0,a.hp-dmg);battle.msg+=' '+battle.wild.name+' struck for '+dmg+' damage.';if(a.hp===0){state.party.push(state.party.shift());battle.msg+=' Your companion needs rest.'}}save()}function attack(){if(!battle)return;const a=state.party[0];if(!a||a.hp<=0){battle.msg='No healthy creature can fight. Try bonding or retreating.';showBattle();return}const w=battle.wild;let dmg=Math.max(2,a.attack-Math.floor(w.def/2)+Math.floor(Math.random()*6));w.hp=Math.max(0,w.hp-dmg);battle.msg=a.name+' dealt '+dmg+' damage.';if(w.hp===0){a.xp+=6;if(a.xp>=12){a.level++;a.xp-=12;a.maxHp+=3;a.hp=Math.min(a.maxHp,a.hp+3);a.attack++;battle.msg+=' '+a.name+' grew to level '+a.level+'!'}save();const msg=battle.msg+' The wild '+w.name+' retreated into the wilderness.';battle=null;say('Battle Complete',msg);return}enemyTurn();showBattle()}function bond(){if(!battle)return;const w=battle.wild;const chance=Math.min(.92,.4+(1-w.hp/w.maxHp)*.5+(state.party.length===0?.3:0));if(Math.random()<chance){w.hp=w.maxHp;w.bond=40;if(state.party.length<4)state.party.push(w);else state.reserve.push(w);if(!state.bonded.includes(w.species))state.bonded.push(w.species);save();battle=null;say('New Companion!','You formed a bond with '+w.name+'! '+(state.party.includes(w)?'It joined your active party.':'It was sent to the sanctuary.'))}else{battle.msg=w.name+' is still wary of you.';enemyTurn();showBattle()}}

function backup(){panel('Save & Backup','<p>Progress is saved automatically on this device. Export a backup before changing versions.</p><p class="muted">Old EvoGenesis saves remain in their original storage and are never overwritten.</p>');addButtons([['Save Now',()=>{save();notify('Game saved');close()}],['Export JSON',()=>{save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EvoGenesis-Mythbound-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}],['Import JSON',()=>document.querySelector('#importFile').click()],['Back',menu]]);const inp=document.createElement('input');inp.type='file';inp.id='importFile';inp.accept='.json,application/json';inp.style.display='none';inp.onchange=async()=>{try{const o=JSON.parse(await inp.files[0].text());if(!defs[o.map]||!Array.isArray(o.party)||!Array.isArray(o.reserve)||!Number.isFinite(o.x)||!Number.isFinite(o.y))throw Error('Invalid Mythbound save');state=o;save();close();updateHUD();notify('Save restored')}catch(e){alert('Import failed: '+e.message)}};host.querySelector('.panel').appendChild(inp)}
